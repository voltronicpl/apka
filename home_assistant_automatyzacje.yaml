# SEKURAK – automatyzacja do Home Assistant (jedna, zastępuje wszystkie poprzednie)
# Ustawienia -> Automatyzacje -> Utwórz -> (⋮) Edytuj w YAML -> wklej -> zapisz.
# W apce Sekurak wpisz adres webhooka: https://pusiloft.ovh/api/webhook/sekurak_wycisz_pudaul75
alias: Sekurak - alarm telefonu
description: Alarm Fold6 przez apkę Sekurak (pełny ekran + WYCISZ ALARM)
triggers:
  - trigger: state
    entity_id: input_boolean.input_boolean_alarm_telefoniczny
    to: "on"
    id: start
  - trigger: state
    entity_id: input_boolean.input_boolean_alarm_telefoniczny
    from: "on"
    to: "off"
    id: stop
  - trigger: webhook
    webhook_id: sekurak_wycisz_pudaul75
    allowed_methods:
      - POST
    local_only: false
    id: wycisz
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: start
        sequence:
          - repeat:
              count: 2
              sequence:
                - action: notify.mobile_app_misiekfon
                  data:
                    message: command_broadcast_intent
                    data:
                      intent_action: pl.sekurak.START
                      intent_package_name: pl.sekurak.alarm
                      priority: high
                      ttl: 0
                - delay:
                    seconds: 3
      - conditions:
          - condition: trigger
            id: stop
        sequence:
          - action: notify.mobile_app_misiekfon
            data:
              message: command_broadcast_intent
              data:
                intent_action: pl.sekurak.STOP
                intent_package_name: pl.sekurak.alarm
                priority: high
                ttl: 0
      - conditions:
          - condition: trigger
            id: wycisz
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.input_boolean_alarm_telefoniczny
mode: restart
max_exceeded: silent
