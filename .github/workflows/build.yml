name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/misiek.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/misiek.jks"
            gradle assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk Sekurak.apk
          else
            echo "Brak sekretów z kluczem – buduję wersję debug"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk Sekurak.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Sekurak
          path: Sekurak.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sekurak v1.0.${{ github.run_number }}
          files: Sekurak.apk
